<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Account Age Checker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2a2a35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            width: 350px;
        }
        h2 { margin-bottom: 20px; color: #ff4545; }
        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #444;
            border-radius: 6px;
            background-color: #1e1e24;
            color: white;
            font-size: 16px;
        }
        button {
            width: 96%;
            padding: 12px;
            background-color: #ff4545;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #e03838; }
        .result {
            margin-top: 25px;
            text-align: left;
            background-color: #1e1e24;
            padding: 15px;
            border-radius: 6px;
            display: none;
            border-left: 4px solid #ff4545;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Roblox ID Age Checker</h2>
    <input type="text" id="userIdInput" placeholder="Enter Roblox User ID (Numbers)...">
    <button onclick="checkAccountAge()">Check Account</button>
    
    <div class="result" id="resultBox"></div>
</div>

<script>
async function checkAccountAge() {
    const userId = document.getElementById('userIdInput').value.trim();
    const resultBox = document.getElementById('resultBox');
    
    if (!userId || isNaN(userId)) {
        alert("Please enter a valid numeric Roblox User ID!");
        return;
    }
    
    resultBox.style.display = "block";
    resultBox.innerHTML = "⏳ Fetching data...";
    
    try {
        // Fetch profile details using the User ID via an open proxy
        const targetUrl = `https://roblox.com{userId}`;
        const proxyUrl = `https://allorigins.win{encodeURIComponent(targetUrl)}`;
        
        const response = await fetch(proxyUrl);
        const rawData = await response.json();
        const profileData = JSON.parse(rawData.contents);
        
        if (profileData.errors) {
            resultBox.innerHTML = `❌ User ID "${userId}" not found.`;
            return;
        }
        
        // Calculate the dates
        const createdDate = new Date(profileData.created);
        const formattedDate = createdDate.toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric'
        });
        
        const timeDiff = Math.abs(new Date() - createdDate);
        const daysOld = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
        
        // Display result
        resultBox.innerHTML = `
            <strong>👤 Account:</strong> ${profileData.displayName} (@${profileData.name})<br>
            <strong>📅 Created On:</strong> ${formattedDate}<br>
            <strong>⏳ Account Age:</strong> ${daysOld.toLocaleString()} days old
        `;
        
    } catch (error) {
        resultBox.innerHTML = `⚠ Error connecting to Roblox servers.`;
        console.error(error);
    }
}
</script>

</body>
</html>
