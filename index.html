<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Account Age Checker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2a2a35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            width: 350px;
        }
        h2 { margin-bottom: 20px; color: #ff4545; }
        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #444;
            border-radius: 6px;
            background-color: #1e1e24;
            color: white;
            font-size: 16px;
        }
        button {
            width: 96%;
            padding: 12px;
            background-color: #ff4545;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #e03838; }
        .result {
            margin-top: 25px;
            text-align: left;
            background-color: #1e1e24;
            padding: 15px;
            border-radius: 6px;
            display: none;
            border-left: 4px solid #ff4545;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Roblox Age Checker</h2>
    <input type="text" id="usernameInput" placeholder="Enter Roblox Username...">
    <button onclick="checkAccountAge()">Check Account</button>
    
    <div class="result" id="resultBox"></div>
</div>

<script>
async function checkAccountAge() {
    const username = document.getElementById('usernameInput').value.trim();
    const resultBox = document.getElementById('resultBox');
    
    if (!username) {
        alert("Please enter a username!");
        return;
    }
    
    resultBox.style.display = "block";
    resultBox.innerHTML = "⏳ Fetching data...";
    
    try {
        // Step 1: Convert username to User ID
        const userUrl = `https://allorigins.win{encodeURIComponent('https://users.roblox.com/v1/usernames/users')}`;
        const userResponse = await fetch(userUrl);
        const userRaw = await userResponse.json();
        
        // Parse the nested proxy data safely
        const targetUrl = 'https://users.roblox.com/v1/usernames/users';
        const userPayload = { usernames: [username], excludeBannedUsers: false };
        
        const finalUserResponse = await fetch(`https://allorigins.win{encodeURIComponent(targetUrl)}&method=POST&body=${encodeURIComponent(JSON.stringify(userPayload))}`);
        const finalUserRaw = await finalUserResponse.json();
        const userData = JSON.parse(finalUserRaw.contents);
        
        if (!userData.data || userData.data.length === 0) {
            resultBox.innerHTML = `❌ Username "${username}" not found.`;
            return;
        }
        
        const userId = userData.data[0].id;
        const displayName = userData.data[0].displayName;
        
        // Step 2: Fetch profile details using the User ID
        const profileUrl = `https://allorigins.win{encodeURIComponent(`https://roblox.com{userId}`)}`;
        const profileResponse = await fetch(profileUrl);
        const profileRaw = await profileResponse.json();
        const profileData = JSON.parse(profileRaw.contents);
        
        // Step 3: Calculate the dates
        const createdDate = new Date(profileData.created);
        const formattedDate = createdDate.toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric'
        });
        
        const timeDiff = Math.abs(new Date() - createdDate);
        const daysOld = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
        
        // Display result
        resultBox.innerHTML = `
            <strong>👤 Account:</strong> ${displayName} (@${username})<br>
            <strong>🆔 User ID:</strong> ${userId}<br>
            <strong>📅 Created On:</strong> ${formattedDate}<br>
            <strong>⏳ Account Age:</strong> ${daysOld.toLocaleString()} days old
        `;
        
    } catch (error) {
        resultBox.innerHTML = `⚠ Error connecting to Roblox servers.`;
        console.error(error);
    }
}
</script>

</body>
</html>
